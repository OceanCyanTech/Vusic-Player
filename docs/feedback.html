<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vusic Player - Send Feedback</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col items-center justify-center p-4">

  <div class="w-full max-w-md bg-slate-800/80 backdrop-blur border border-slate-700 rounded-2xl p-6 shadow-xl">
    
    <!-- Title with Transparent App Icon -->
    <div class="flex items-center gap-3 mb-2">
      <img 
        src="https://raw.githubusercontent.com/OceanCyanTech/Vusic-Player/refs/heads/master/Vusic%20Player/Assets/appicon.png" 
        alt="Vusic Player Logo" 
        class="w-10 h-10 object-contain shrink-0 drop-shadow-md"
        onerror="this.style.display='none'"
      />
      <div>
        <h2 class="text-2xl font-bold text-sky-400 leading-tight">Vusic Player</h2>
        <h3 class="text-xs font-medium text-slate-400">Send Feedback</h3>
      </div>
    </div>

    <!-- Description (hidden after submission) -->
    <p id="formIntro" class="text-sm text-slate-400 mb-6">Let us know about bugs, feature requests, or suggestions.</p>

    <!-- Feedback Container (No <form> tag to prevent page refresh) -->
    <div id="feedbackFormContainer" class="space-y-4">
      <div>
        <label class="block text-xs font-semibold text-slate-300 uppercase mb-1">Feedback Type</label>
        <select id="feedbackType" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-200 focus:outline-none focus:border-sky-500">
          <option value="Bug Report">Bug Report</option>
          <option value="Feature Request">Feature Request</option>
          <option value="General Feedback">General Feedback</option>
        </select>
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-300 uppercase mb-1">Your Email (Optional)</label>
        <input type="email" id="userEmail" placeholder="name@example.com" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-200 focus:outline-none focus:border-sky-500" />
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-300 uppercase mb-1">Message</label>
        <textarea id="userMessage" rows="4" required placeholder="Describe the issue or feature in detail..." class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-200 focus:outline-none focus:border-sky-500"></textarea>
      </div>

      <button type="button" id="submitBtn" class="w-full bg-sky-500 hover:bg-sky-400 text-slate-950 font-semibold py-2.5 rounded-lg text-sm transition">
        Submit Feedback
      </button>

      <!-- Inline Error Message Display -->
      <p id="errorMessage" class="text-center text-xs text-rose-400 mt-2 hidden"></p>
    </div>

    <!-- Success Screen (Shows after successful submit) -->
    <div id="successCard" class="hidden text-center py-6">
      <div class="w-12 h-12 bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 rounded-full flex items-center justify-center mx-auto mb-3">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
        </svg>
      </div>
      <h3 class="text-lg font-bold text-slate-100 mb-1">Feedback Received!</h3>
      <p class="text-xs text-slate-400 mb-6">Thank you for helping improve Vusic Player.</p>
      <button type="button" id="sendAnotherBtn" class="bg-slate-700 hover:bg-slate-600 text-slate-200 text-xs font-semibold py-2 px-4 rounded-lg transition">
        Send Another Response
      </button>
    </div>

  </div>

  <!-- Bottom OceanCyan Footer Branding -->
  <footer class="mt-6 flex items-center justify-center gap-3 text-sm text-slate-400">
    <img 
      src="https://raw.githubusercontent.com/OceanCyanTech/Vusic-Player/refs/heads/master/Vusic%20Player/Assets/OceanCyan%20Logo.png" 
      alt="OceanCyan Tech Logo" 
      class="h-7 w-auto object-contain drop-shadow"
      onerror="this.style.display='none'"
    />
    <span class="font-medium">&copy; 2026 OceanCyan Tech. All rights reserved.</span>
  </footer>

  <script>
    const SUPABASE_URL = 'https://bdjkwfbjoswkaeqosyvp.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_TXTb7MnFqwMvUvKAtxyBEQ_edLTAb0T';

    const formContainer = document.getElementById('feedbackFormContainer');
    const formIntro = document.getElementById('formIntro');
    const successCard = document.getElementById('successCard');
    const errorMsg = document.getElementById('errorMessage');
    const sendAnotherBtn = document.getElementById('sendAnotherBtn');
    const submitBtn = document.getElementById('submitBtn');

    submitBtn.addEventListener('click', async () => {
      errorMsg.classList.add('hidden');
      
      const type = document.getElementById('feedbackType').value;
      const email = document.getElementById('userEmail').value.trim() || null;
      const message = document.getElementById('userMessage').value.trim();

      if (!message) {
        errorMsg.textContent = 'Please enter a message before submitting.';
        errorMsg.classList.remove('hidden');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Sending...';

      try {
        const response = await fetch(`${SUPABASE_URL}/rest/v1/feedback`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'apikey': SUPABASE_ANON_KEY,
            'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
            'Prefer': 'return=minimal'
          },
          body: JSON.stringify([{ type, email, message }])
        });

        if (!response.ok) {
          const errData = await response.json();
          throw new Error(errData.message || `Server responded with status ${response.status}`);
        }

        // Show success screen
        formContainer.classList.add('hidden');
        formIntro.classList.add('hidden');
        successCard.classList.remove('hidden');

        // Clear input values
        document.getElementById('userEmail').value = '';
        document.getElementById('userMessage').value = '';

      } catch (err) {
        errorMsg.textContent = `Error: ${err.message}`;
        errorMsg.classList.remove('hidden');
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Submit Feedback';
      }
    });

    sendAnotherBtn.addEventListener('click', () => {
      successCard.classList.add('hidden');
      formContainer.classList.remove('hidden');
      formIntro.classList.remove('hidden');
      errorMsg.classList.add('hidden');
    });
  </script>
</body>
</html>
