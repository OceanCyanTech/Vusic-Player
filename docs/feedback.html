<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vusic Player - Send Feedback</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Supabase Client Library -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-4">

  <div class="w-full max-w-md bg-slate-800/80 backdrop-blur border border-slate-700 rounded-2xl p-6 shadow-xl">
    <h2 class="text-2xl font-bold mb-1 text-sky-400">Vusic Player</h2>
    <h3 class="text-lg font-semibold mb-1 text-slate-200">Send Feedback</h3>
    <p class="text-sm text-slate-400 mb-6">Let us know about bugs, feature requests, or suggestions.</p>

    <form id="feedbackForm" class="space-y-4">
      <div>
        <label class="block text-xs font-semibold text-slate-300 uppercase mb-1">Feedback Type</label>
        <select id="feedbackType" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-200 focus:outline-none focus:border-sky-500">
          <option value="Bug Report">Bug Report</option>
          <option value="Feature Request">Feature Request</option>
          <option value="General Feedback">General Feedback</option>
        </select>
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-300 uppercase mb-1">Your Email (Optional)</label>
        <input type="email" id="userEmail" placeholder="name@example.com" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-200 focus:outline-none focus:border-sky-500" />
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-300 uppercase mb-1">Message</label>
        <textarea id="userMessage" rows="4" required placeholder="Describe the issue or feature in detail..." class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-200 focus:outline-none focus:border-sky-500"></textarea>
      </div>

      <button type="submit" id="submitBtn" class="w-full bg-sky-500 hover:bg-sky-400 text-slate-950 font-semibold py-2.5 rounded-lg text-sm transition">
        Submit Feedback
      </button>

      <p id="formStatus" class="text-center text-xs mt-2 hidden"></p>
    </form>
  </div>

  <script>
    const SUPABASE_URL = 'https://bdjkwfbjoswkaeqosyvp.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_TXTb7MnFqwMvUvKAtxyBEQ_edLTAb0T';

    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const form = document.getElementById('feedbackForm');
    const status = document.getElementById('formStatus');
    const submitBtn = document.getElementById('submitBtn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      submitBtn.disabled = true;
      submitBtn.textContent = 'Sending...';

      const type = document.getElementById('feedbackType').value;
      const email = document.getElementById('userEmail').value.trim() || null;
      const message = document.getElementById('userMessage').value.trim();

      const { data, error } = await supabase
        .from('feedback')
        .insert([{ type, email, message }]);

      if (error) {
        status.textContent = 'Error sending feedback. Please try again.';
        status.className = 'text-center text-xs mt-2 text-rose-400';
      } else {
        status.textContent = 'Feedback received! Thank you.';
        status.className = 'text-center text-xs mt-2 text-emerald-400';
        form.reset();
      }

      submitBtn.disabled = false;
      submitBtn.textContent = 'Submit Feedback';
    });
  </script>
</body>
</html>
